name: Task1272 corrected real-profile lifecycle confirmation (non-shipping)

# Exact corrected client743/server710, Ubuntu+Mac real-profile cases once.
# This does not replace compatibility.yml, publish or change production source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: bounded (${{ matrix.os }}, ${{ matrix.case }}, Node26.13.0)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, case: real-profile, file: test/real-daemon-profile.test.js }
          - { os: macos-latest, case: real-profile, file: test/real-daemon-profile.test.js }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      CLIENT_SHA: d4b0d4c7516f4ea34272b3203c3f5813ae559170
      CLIENT_TREE: 0fad8599f6d3afa68504da4c5f2a70a472a354a1
      SERVER_SHA: 6eebf71a574551cfa5c35fc3d017b45d6b94b029
      SERVER_TREE: 2307c1a3b6650b1d14cf1bc54bf867392b0abe01
      CLIENT_TEST: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dmsdc-ai/aigentry-telesession
          ref: d4b0d4c7516f4ea34272b3203c3f5813ae559170
          path: telesession
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dmsdc-ai/aigentry-telepty
          ref: 6eebf71a574551cfa5c35fc3d017b45d6b94b029
          path: telepty
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Verify exact execution source and create private evidence paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C telesession rev-parse HEAD)" = "$CLIENT_SHA"
          test "$(git -C telesession rev-parse 'HEAD^{tree}')" = "$CLIENT_TREE"
          test "$(git -C telepty rev-parse HEAD)" = "$SERVER_SHA"
          test "$(git -C telepty rev-parse 'HEAD^{tree}')" = "$SERVER_TREE"
          case "$CLIENT_TEST" in test/real-daemon-profile.test.js) ;; *) exit 2 ;; esac
          COMPAT="$RUNNER_TEMP/client746"
          mkdir -p "$COMPAT/child-logs" "$COMPAT/npm-cache"
          : > "$COMPAT/empty-npmrc"
          {
            echo "COMPAT=$COMPAT"
            echo "TELESESSION_TEST_TELEPTY_DIR=$GITHUB_WORKSPACE/telepty"
            echo "TELESESSION_TEST_LOG_DIR=$COMPAT/child-logs"
            echo "TELESESSION_TEST_REQUIRE_PROFILE_DAEMON=1"
            echo "npm_config_cache=$COMPAT/npm-cache"
            echo "npm_config_userconfig=$COMPAT/empty-npmrc"
            echo "npm_config_update_notifier=false"
            echo "npm_config_fund=false"
            echo "npm_config_audit=false"
          } >> "$GITHUB_ENV"
          {
            echo 'task1272; diagnostic only; per-test60s/step3min/job8min caps; no force-exit or pass on cancellation'
            echo "test=$CLIENT_TEST"
            git -C telesession rev-parse HEAD 'HEAD^{tree}'
            git -C telepty rev-parse HEAD 'HEAD^{tree}'
            node --version
            npm --version
          } | tee "$COMPAT/identity.txt"
      - name: Install Telesession from lockfile (no lifecycle)
        working-directory: telesession
        run: npm ci --ignore-scripts
      - name: Install Telepty from lockfile (no root lifecycle)
        working-directory: telepty
        run: npm ci --ignore-scripts
      - name: Build node-pty only (existing reviewed compatibility exception)
        shell: bash
        working-directory: telepty
        run: |
          set -euo pipefail
          npm rebuild node-pty --foreground-scripts 2>&1 | tee "$COMPAT/node-pty-rebuild.log"
          node -e 'require("node-pty"); console.log("node-pty loads")'
      - name: Build bundled Darwin authority reader (maintained command)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: telepty
        run: |
          set -euo pipefail
          NODE_HEADERS="$(dirname "$(dirname "$(command -v node)")")/include/node"
          node scripts/build-authority-darwin.mjs --cc "$(xcrun --find clang)" --sdk "$(xcrun --show-sdk-path)" --node-headers "$NODE_HEADERS"
          shasum -a 256 src/principal/native/prebuilt/darwin/authority-darwin.node src/principal/native/prebuilt/darwin/authority-darwin.node.provenance.json | tee "$COMPAT/native-after.txt"
      - name: Run exactly one file with shorter diagnostic caps, once
        timeout-minutes: 3
        shell: bash
        working-directory: telesession
        run: |
          set +e
          node --test --test-timeout=60000 --test-reporter=tap "$CLIENT_TEST" 2>&1 | tee "$COMPAT/tests.tap"
          result=${PIPESTATUS[0]}
          echo "$result" > "$COMPAT/tests.exit"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          grep -qE '^# tests 3$' "$COMPAT/tests.tap" || exit 1
          grep -qE '^# fail 0$' "$COMPAT/tests.tap" || exit 1
          grep -qE '^# skipped 0$' "$COMPAT/tests.tap" || exit 1
          grep -qE '^ok [0-9]+ - S-R1 two profiles' "$COMPAT/tests.tap" || exit 1
          grep -qE '^ok [0-9]+ - S-R1b rotation' "$COMPAT/tests.tap" || exit 1
          grep -qE '^ok [0-9]+ - S-T4a' "$COMPAT/tests.tap" || exit 1
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client746-${{ matrix.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client746
          if-no-files-found: error
          retention-days: 7
