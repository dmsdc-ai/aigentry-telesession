name: Task1272 exact corrected candidate pack identity
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
      with:
        ref: f4a84b0b0749189301766631cb54c9768252d948
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 20.20.0
    - name: Bind exact candidate and prepare pack-only output
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = f4a84b0b0749189301766631cb54c9768252d948

        test "$(git rev-parse ''HEAD^{tree}'')" = 63e66c9cc074e789dc42dadfca1f59018742ab2c

        test -z "$(git status --porcelain)"

        COMPAT="$RUNNER_TEMP/client756"

        mkdir -p "$COMPAT/pack"

        echo "COMPAT=$COMPAT" >> "$GITHUB_ENV"

        { git rev-parse HEAD ''HEAD^{tree}''; node --version; npm --version; } | tee "$COMPAT/identity.txt"

        '
    - name: Pack with the exact maintained compatibility command
      shell: bash
      run: "set -euo pipefail\nnpm pack --ignore-scripts --json --pack-destination \"$COMPAT/pack\" > \"$COMPAT/pack.json\"\nnode -e\
        \ '\n  const fs = require(\"fs\"), path = require(\"path\"), crypto = require(\"crypto\");\n  const [p] = JSON.parse(fs.readFileSync(path.join(process.env.COMPAT,\
        \ \"pack.json\"), \"utf8\"));\n  const tgz = path.join(process.env.COMPAT, \"pack\", p.filename);\n  const sha256 = crypto.createHash(\"\
        sha256\").update(fs.readFileSync(tgz)).digest(\"hex\");\n  fs.writeFileSync(path.join(process.env.COMPAT, \"tarball.json\"),\
        \ JSON.stringify({ filename: p.filename, sha256, integrity: p.integrity, entries: p.entryCount }, null, 2) + \"\\n\");\n  fs.appendFileSync(process.env.GITHUB_ENV,\
        \ \"TELESESSION_TGZ=\" + tgz + \"\\n\");\n  console.log(p.filename, sha256);'\n"
    - name: Compare actual archive bytes to the previously installed Linux20 archive
      shell: bash
      run: 'set -euo pipefail

        node -e ''const f=require("node:fs"),p=require("node:path"),j=JSON.parse(f.readFileSync(p.join(process.env.COMPAT,"tarball.json")));if(j.sha256!=="06389ef166bfb9bdd996ef29867f445336e69ef995f33dc2c24e0b764cf4cde7"||j.entries!==24||j.filename!=="dmsdc-ai-telesession-0.3.0.tgz")throw
        Error("Archive differs from the previously installed archive");console.log(JSON.stringify({exactBytesMatch:true,...j}))''

        '
    - name: Retain candidate pack and identity evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: telesession-756-exact-pack-${{ github.run_id }}
        path: ${{ runner.temp }}/client756
        if-no-files-found: error
        retention-days: 7
