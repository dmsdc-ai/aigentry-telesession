name: Task1272 Windows profile-config correction734, targeted only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    name: Windows profile-config Node${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.0', '26.13.0']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52ad5502b02774eb550875d15e44b07ef90aac1b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record exact source and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 52ad5502b02774eb550875d15e44b07ef90aac1b
          test "$(git rev-parse 'HEAD^{tree}')" = 6f0a61a4169410d436e495b81b92275517514755
          mkdir -p "$RUNNER_TEMP/client742"
          {
            echo 'task1272; one unchanged profile-config file; source734; no full compatibility claim'
            git rev-parse HEAD 'HEAD^{tree}'
            git ls-files --stage test/profile-config.test.js src/config.js
            node --version
            npm --version
          } | tee "$RUNNER_TEMP/client742/identity.txt"
      - name: Install exact lockfile, no lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the one corrected configuration file once
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap test/profile-config.test.js 2>&1 | tee "$RUNNER_TEMP/client742/tests.tap"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/client742/tests.exit"
          exit "$result"
      - name: Upload all evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client742-windows-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client742
          if-no-files-found: error
          retention-days: 7
