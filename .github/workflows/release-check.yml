# Release verification gate. Runs the reusable CI first; nothing below runs unless it passes.
# compatibility.yml always runs before the gate: against telepty_ref when a manual run supplies one, otherwise (tag
# pushes, empty input) against the pinned PINNED_TELEPTY_SHA below. Issue #16 (review698 RB1): its Linux/macOS legs
# require the S-R1 profile rows, so a release check can never pass on a skipped S-R1. It creates no release,
# publishes nothing to npm and deploys nothing. See docs/ci.md.
name: Release check

on:
  workflow_dispatch:
    inputs:
      telepty_ref:
        description: "Optional dmsdc-ai/aigentry-telepty commit (exactly 40 lowercase hex). Set: compatibility.yml must pass against it. Empty: it must pass against the pinned PINNED_TELEPTY_SHA."
        required: false
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Same commit as publish.yml TELEPTY_SHA: dmsdc-ai/aigentry-telepty server candidate commit 6eebf71a (tree 2307c1a3…,
  # client-profile-scope-v1), the current immutable CI/release candidate anchor. Full server CI and security pending;
  # publication NOT_APPROVED. A later server fix means a new exact SHA in both files. Never a branch, tag name or "latest".
  PINNED_TELEPTY_SHA: 6eebf71a574551cfa5c35fc3d017b45d6b94b029

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Empty (always on tag pushes) = the pinned commit. Anything else must be a 40-hex SHA or the run fails.
  compat-request:
    name: compatibility request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      requested: ${{ steps.check.outputs.requested }}
      telepty_ref: ${{ steps.check.outputs.telepty_ref }}
    steps:
      - name: Validate telepty_ref (before any checkout)
        id: check
        shell: bash
        env:
          TELEPTY_REF: ${{ inputs.telepty_ref }}
        run: |
          set -euo pipefail
          if [ -z "$TELEPTY_REF" ]; then
            TELEPTY_REF="$PINNED_TELEPTY_SHA"
            echo "::notice::telepty_ref not supplied: compatibility runs against the pinned Telepty commit $TELEPTY_REF (CI/release candidate anchor; publication NOT_APPROVED)"
          fi
          if [[ "$TELEPTY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            { echo "requested=true"; echo "telepty_ref=$TELEPTY_REF"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error::telepty_ref must be empty or exactly 40 lowercase hex characters (immutable commit SHA)"
            exit 1
          fi

  compatibility:
    needs: [ci, compat-request]
    if: needs.compat-request.outputs.requested == 'true'
    uses: ./.github/workflows/compatibility.yml
    with:
      telepty_ref: ${{ needs.compat-request.outputs.telepty_ref }}
    permissions:
      contents: read

  release-gate:
    name: release gate
    needs: [ci, compat-request, compatibility]
    # Runs unless cancelled so an unmet precondition fails the run instead of being a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preconditions (CI passed; a requested compatibility run passed on the exact SHA)
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci.result }}
          REQUEST_RESULT: ${{ needs.compat-request.result }}
          REQUESTED: ${{ needs.compat-request.outputs.requested }}
          REQUESTED_REF: ${{ needs.compat-request.outputs.telepty_ref }}
          COMPAT_RESULT: ${{ needs.compatibility.result }}
          COMPAT_SHA: ${{ needs.compatibility.outputs.telepty_sha }}
        run: |
          set -euo pipefail
          [ "$CI_RESULT" = success ] || { echo "::error::ci: $CI_RESULT"; exit 1; }
          [ "$REQUEST_RESULT" = success ] || { echo "::error::compatibility request: $REQUEST_RESULT"; exit 1; }
          case "$REQUESTED" in
            true)
              [ "$COMPAT_RESULT" = success ] || { echo "::error::compatibility: $COMPAT_RESULT"; exit 1; }
              [ "$COMPAT_SHA" = "$REQUESTED_REF" ] || { echo "::error::compatibility verified '$COMPAT_SHA', requested '$REQUESTED_REF'"; exit 1; }
              ;;
            false)
              echo "::error::compatibility (with the required S-R1 profile rows) is mandatory for a release check"; exit 1
              ;;
            *) echo "::error::compatibility request state unknown"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.0"

      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const v = JSON.parse(require("fs").readFileSync("package.json", "utf8")).version;
            if (process.env.REF_NAME !== "v" + v) {
              console.error("tag " + process.env.REF_NAME + " does not match package.json version v" + v);
              process.exit(1);
            }'

      - name: npm pack --dry-run (nothing is published)
        shell: bash
        run: npm run --silent check:pack

      - name: Ready summary
        shell: bash
        env:
          REQUESTED: ${{ needs.compat-request.outputs.requested }}
          COMPAT_SHA: ${{ needs.compatibility.outputs.telepty_sha }}
        run: |
          {
            echo "### release check: verification passed"
            echo "- CI unit matrix (ubuntu/macos/windows, Node 20.20.0): passed"
            echo "- npm pack --dry-run: passed (file layout only; it does not publish and does not imply publication readiness or authorization)"
            echo "- Telepty compatibility (compatibility.yml, ubuntu/macos/windows, Node 20.20.0 and 26.13.0): passed against dmsdc-ai/aigentry-telepty@$COMPAT_SHA on GitHub runners only"
            echo "- Issue #16 S-R1/S-R1b profile rows: required and passed on Linux and macOS against that commit; Windows: configured-mode refusal only (no cross-profile claim)"
            [ "$COMPAT_SHA" = "$PINNED_TELEPTY_SHA" ] && echo "- Telepty commit is the pinned CI/release candidate anchor; publication is NOT_APPROVED by this result"
            echo "- NOT released: no GitHub release, npm publish or deployment was performed by this workflow. This result authorizes no tag or publication."
            echo "- Still required before publication: the cross-host Mac/Linux live communication gate (before Telepty publication). See docs/ci.md."
          } >> "$GITHUB_STEP_SUMMARY"
